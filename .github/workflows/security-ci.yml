name: Security CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  application-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: backend/requirements.txt }
      - name: Install backend and security tools
        run: pip install -r backend/requirements.txt pip-audit bandit semgrep
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Dependency audit
        run: pip-audit -r backend/requirements.txt
      - name: Python static analysis
        run: bandit -r backend/app -x backend/tests -ll
      - name: Semgrep
        run: semgrep scan --config p/owasp-top-ten --config p/python --error backend/app frontend/src
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend dependency gate
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Build frontend
        working-directory: frontend
        run: npm run build

