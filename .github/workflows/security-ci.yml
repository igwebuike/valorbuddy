name: Security CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  application-security:
    name: Application security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend and security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest pip-audit bandit

      - name: Install Semgrep in isolated environment
        run: |
          python -m pip install --upgrade pipx
          python -m pipx install semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compile backend
        run: python -m compileall -q backend/app

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q

      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt

      - name: Run Python static analysis
        run: bandit -r backend/app -x backend/tests -ll

      - name: Run Semgrep
        run: semgrep scan --config p/owasp-top-ten --config p/python --error backend/app frontend/src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build