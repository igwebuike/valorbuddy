services:
  - type: web
    name: valorbuddy-staging
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - { key: PYTHON_VERSION, value: 3.11.9 }
      - { key: ENVIRONMENT, value: staging }
      - { key: SECURITY_ENFORCE_CONFIG, value: 'true' }
      - { key: FORCE_HTTPS, value: 'true' }
      - { key: CORS_ORIGINS, value: 'https://staging.valorbuddy.com' }
      - { key: ALLOWED_HOSTS, value: 'valorbuddy-staging.onrender.com,staging.valorbuddy.com' }
      - { key: DATABASE_URL, sync: false }
      - { key: SECRET_KEY, sync: false }
  - type: static
    name: valorbuddy-frontend-staging
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    routes:
      - { type: rewrite, source: '/*', destination: /index.html }
    envVars:
      - { key: VITE_API_BASE_URL, value: 'https://valorbuddy-staging.onrender.com' }
